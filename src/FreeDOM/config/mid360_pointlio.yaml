/**:
  ros__parameters:
    pointcloud_topic: "/cloud_registered_lidar"
    sensor_tf_frame: "lidar"
    map_tf_frame: "odom"
    save_map_topic: "save_map"
    save_map_path: "./map_"
    enable_visualization: false
    num_threads: 8

    sensor:
      min_range: 0.3
      max_range: 40.0
      min_z: -5.0
      max_z: 8.0

    map:
      sub_voxel_size: 0.1
      voxel_depth: 2
      block_depth: 5

      enable_local_map: false
      local_map_range: 50.0
      local_map_min_z: -20.0
      local_map_max_z: 20.0

      raycast_max_range: 20.0
      raycast_min_z: -3.0
      raycast_max_z: 4.0
      counts_to_free: 3
      counts_to_revert: 20
      conservative_connectivity: 26
      aggressive_connectivity: 124

    raycast_enhancement:
      # Off uses plain raycast. Enabling requires a calibrated FOV mask, and the benefit under MID-360's non-repetitive scan is unverified.
      enable_raycast_enhancement: false
      lidar_horizon_fov_degree: 360.0
      lidar_vertical_fov_upper_degree: 52.0
      lidar_vertical_fov_lower_degree: -7.0
      depth_image_vertical_lines: 64
      depth_image_min_range: 0.3
      max_raycast_enhancement_range: 20.0
      raycast_enhancement_depth_margin: 0.2
      inpaint_size: 4
      erosion_size: 1
      min_raycast_enhancement_area: 0.001
      depth_image_top_margin: 0.2
      learn_fov: false
      enable_fov_mask: false
      fov_mask_path: ""
      fov_mask_name: ""
